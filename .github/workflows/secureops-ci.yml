name: SecureOps CI
on:
  push:
    paths:
      - 'secureops/**'
      - '.github/workflows/secureops-ci.yml'
  pull_request:
    paths:
      - 'secureops/**'
      - '.github/workflows/secureops-ci.yml'
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secureops/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests
        env:
          PYTHONPATH: .
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secureops/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
